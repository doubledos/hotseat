<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hot Seat — Category Card</title>
<link rel="stylesheet" href="../tokens/colors.css">
<link rel="stylesheet" href="../tokens/typography.css">
<link rel="stylesheet" href="../tokens/patterns.css">
<style>
  html,body{margin:0;background:#1a1a1a;}
  .frame{width:100%;max-width:1600px;margin:0 auto;aspect-ratio:16/9;font-family:var(--font-heading);}
  .content{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.4vh,26px);text-align:center;}
  .eyebrow{font:var(--text-eyebrow);letter-spacing:var(--tracking-wider);color:var(--gold-label);}
  .title{font:var(--text-display-xl);line-height:0.9;color:var(--cream);margin:0;}
  .rule{width:clamp(80px,10vw,180px);height:clamp(4px,0.5vw,8px);background:var(--gold-accent);margin-top:0.4em;}
</style>
</head>
<body>
  <div class="frame hs-stage hs-stage--maroon">
    <div class="content">
      <div class="eyebrow">CATEGORY</div>
      <div class="title">MOVIE<br>TRIVIA</div>
      <div class="rule"></div>
    </div>
  </div>
</body>
</html>
